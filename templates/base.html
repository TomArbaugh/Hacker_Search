<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Hacker News Semantic Search{% endblock %}</title>
  <style>
    :root { --fg: #1a1a1a; --muted: #777; --line: #e2e2e2; --accent: #ff6600; }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: var(--fg); max-width: 720px; margin: 0 auto; padding: 40px 16px 80px;
      line-height: 1.5;
    }
    h2 { margin-bottom: 4px; }
    .tagline { color: var(--muted); margin-top: 0; }
    form { display: flex; gap: 8px; margin: 20px 0; }
    input[type=text] {
      flex: 1; padding: 12px 14px; font-size: 16px;
      border: 1px solid var(--line); border-radius: 8px;
    }
    input[type=text]:focus { outline: 2px solid var(--accent); border-color: transparent; }
    button {
      padding: 12px 20px; font-size: 16px; cursor: pointer; color: #fff;
      background: var(--accent); border: none; border-radius: 8px;
    }
    .count { color: var(--muted); font-size: 14px; }
    .result { border-top: 1px solid var(--line); padding: 16px 0; }
    .result h3 { margin: 0 0 6px; font-size: 17px; }
    .snippet { margin: 6px 0; color: #444; }
    .meta { color: var(--muted); font-size: 13px; margin: 6px 0; }
    .result a { font-size: 13px; color: #386fa4; word-break: break-all; }
    .distance { border-bottom: 1px dotted var(--muted); cursor: help; }
    .notice { background: #fff8e1; border: 1px solid #ffe082; padding: 10px 14px;
              border-radius: 8px; font-size: 14px; }
  </style>
</head>
<body>
  {% block content %}{% endblock %}
</body>
</html>
